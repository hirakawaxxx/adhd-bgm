<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="集中しやすくなるためのホワイト・ピンク・ブラウンノイズを再生するシンプルなプレイヤー" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eeede9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141716" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="集中ノイズ" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://noise.app.hirakawaxxx.com/" />
    <meta property="og:title" content="集中用ノイズ" />
    <meta property="og:description" content="ホワイト・ピンク・ブラウンノイズを、小さめの音量で流せるシンプルなプレイヤー" />
    <meta property="og:image" content="https://noise.app.hirakawaxxx.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="集中用ノイズ" />
    <meta name="twitter:description" content="ホワイト・ピンク・ブラウンノイズを、小さめの音量で流せるシンプルなプレイヤー" />
    <meta name="twitter:image" content="https://noise.app.hirakawaxxx.com/og.png" />
    <title>ADHD BGM - 集中用ノイズ</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/zen-maru-gothic-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/components.css" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="layout">
      <header class="header">
        <h1 class="ui-text-title">集中用ノイズ</h1>
        <p class="lead ui-text-body ui-text-muted">合うノイズを選んで、小さめの音量で流してください。</p>
      </header>

      <main class="controls">
        <div class="noise-group" role="group" aria-labelledby="noise-heading">
          <h2 id="noise-heading" class="ui-text-label ui-text-muted">ノイズの種類</h2>
          <button type="button" class="ui-card ui-card--selectable noise-option" data-noise="white" aria-pressed="false">
            <span class="noise-text">
              <span class="noise-name ui-text-label">ホワイト</span>
              <span class="noise-desc ui-text-caption">高音まで均一</span>
            </span>
          </button>
          <button type="button" class="ui-card ui-card--selectable noise-option" data-noise="pink" aria-pressed="true">
            <span class="noise-text">
              <span class="noise-name ui-text-label">ピンク</span>
              <span class="noise-desc ui-text-caption">雨音に近い</span>
            </span>
          </button>
          <button type="button" class="ui-card ui-card--selectable noise-option" data-noise="brown" aria-pressed="false">
            <span class="noise-text">
              <span class="noise-name ui-text-label">ブラウン</span>
              <span class="noise-desc ui-text-caption">低くこもった音</span>
            </span>
          </button>
        </div>

        <div class="volume">
          <div class="volume-header">
            <label for="volume" class="ui-text-label ui-text-muted">音量</label>
            <output id="volume-value" for="volume" class="ui-text-label ui-text-muted">30%</output>
          </div>
          <input id="volume" class="ui-slider" type="range" min="0" max="1" step="0.01" value="0.3" />
        </div>

        <div class="play-area">
          <button type="button" id="play-button" class="ui-button ui-button--primary ui-button--round play-button" data-playing="false">
            <svg class="play-icon play-icon--play" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z" />
            </svg>
            <svg class="play-icon play-icon--stop" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="6" y="6" width="12" height="12" rx="2.5" />
            </svg>
            <span id="play-label" class="ui-text-label">再生</span>
          </button>
        </div>

        <div class="status-region" role="status" aria-live="polite">
          <div id="status-alert" class="ui-alert status-alert">
            <svg class="ui-alert__icon status-icon status-icon--warning" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 4 2.8 19.5a1 1 0 0 0 .86 1.5h16.68a1 1 0 0 0 .86-1.5Z" />
              <path d="M12 10v4.5M12 17.5v.01" />
            </svg>
            <svg class="ui-alert__icon status-icon status-icon--error" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7.5v5.5M12 16.5v.01" />
            </svg>
            <span id="status"></span>
          </div>
        </div>
      </main>

      <footer class="footer">
        <p class="ui-text-caption">
          医療機器ではありません。効果には個人差があり、逆に集中しにくくなる人もいます。小さめの音量で使い、長時間の大音量は避けてください。
        </p>
      </footer>
    </div>
  </body>
</html>
